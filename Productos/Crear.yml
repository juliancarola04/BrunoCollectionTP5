info:
  name: Crear
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/api/productos"
  body:
    type: json
    data: |-
      {
        "nombre": "Yerbera",
        "precioCompra": 6000,
        "precioVenta": 12500,
        "stock": 20,
        "categoriaId": 2
      }
