info:
  name: Actualizar
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseURL}}/api/usuarios/admin/actualizar/{idUsuario}"
  body:
    type: json
    data: |-
      {
          "username" : "username",
          "email" : "email",
          "password" : "password"
      }
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
