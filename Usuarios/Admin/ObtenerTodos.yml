info:
  name: ObtenerTodos
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/api/usuarios/?eliminado=false&numeropagina=1&tamanopagina=20"
  params:
    - name: eliminado
      value: "false"
      type: query
    - name: numeropagina
      value: "1"
      type: query
    - name: tamanopagina
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
