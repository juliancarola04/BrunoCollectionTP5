info:
  name: Crear
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/api/ingresos"
  body:
    type: json
    data: |-
      {
        "proveedorId": 1,
        "items": [
          {
            "productoId": 3,
            "cantidad": 10,
            "precioUnitario": 1000
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
