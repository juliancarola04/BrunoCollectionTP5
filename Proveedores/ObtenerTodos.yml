info:
  name: ObtenerTodos
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/proveedores/admin/?buscar=ites&ordenarpor=razonsocial&direccion=desc"
  params:
    - name: buscar
      value: ites
      type: query
    - name: ordenarpor
      value: razonsocial
      type: query
    - name: direccion
      value: desc
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
