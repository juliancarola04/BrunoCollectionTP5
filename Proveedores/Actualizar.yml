info:
  name: Actualizar
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseURL}}/api/proveedores/admin/actualizar/{idProveedor}"
  body:
    type: json
    data: |-
      {
        "razonSocial": "Razon Social",
        "cuit": "CUIT",
        "direccion": "Direccion",
        "email": "Email@gmail.com",
        "telefono": "Telefono"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
