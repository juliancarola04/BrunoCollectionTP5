info:
  name: CrearVenta
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/api/ventas"
  body:
    type: json
    data: |-
      {
        "clienteId": 1,
        "items": [
          { "productoId": 1, "cantidad": 2 }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
