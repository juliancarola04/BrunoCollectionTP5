opencollection: 1.0.0

info:
  name: Auth
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: ""
  variables:
    - name: baseURL
      value: https://localhost:7128
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
